name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    env:
      # prisma.config.js resolves DATABASE_URL eagerly (even for `prisma generate`,
      # which never opens a connection). No real database is needed here: unit
      # tests run against a mocked Prisma client (src/__tests__/mocks/prisma.ts)
      # and override this value in src/__tests__/setup.ts. A placeholder is enough.
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci_placeholder'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test
